name: Build and Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  linux:
    name: Linux GUI and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows GUI and tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package Windows preview
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path preview | Out-Null
          Copy-Item "build/Release/SignalForge.exe" "preview/SignalForge.exe"
          Copy-Item "LICENSE" "preview/LICENSE"
          windeployqt --release --no-translations --compiler-runtime "preview/SignalForge.exe"
          # SQLite is a runtime plugin. Make its presence explicit in the
          # extracted ZIP so offline maps also work on non-developer PCs.
          $qtBin = Split-Path (Get-Command windeployqt).Source
          $sqlitePlugin = Join-Path (Split-Path $qtBin -Parent) "plugins/sqldrivers/qsqlite.dll"
          if (!(Test-Path $sqlitePlugin)) { throw "Missing Qt SQLite plugin: $sqlitePlugin" }
          New-Item -ItemType Directory -Force -Path "preview/sqldrivers" | Out-Null
          Copy-Item $sqlitePlugin "preview/sqldrivers/qsqlite.dll" -Force
          # Ship a known RTL-SDR Blog release so an installed WinUSB driver is
          # sufficient for most testers. Never substitute an untrusted DLL from
          # PATH/CWD. This version supports both generic RTL2832U and Blog V4.
          $rtlVersion = "V1.4.0"
          $driverZip = Join-Path $env:RUNNER_TEMP "rtl-sdr-blog-$rtlVersion.zip"
          $driverRoot = Join-Path $env:RUNNER_TEMP "rtl-sdr-blog-extracted"
          $download = "https://github.com/rtlsdrblog/rtl-sdr-blog/releases/download/$rtlVersion/Release.zip"
          Invoke-WebRequest -Uri $download -OutFile $driverZip
          # Pin upstream download bytes as well as the release tag. This
          # prevents quietly replacing a tested driver dependency.
          $expectedHash = "7EF33F1304647F65E5E0FDE43637A73D54F076E91E651A3CECC4F55A17FD9815"
          $actualHash = (Get-FileHash -Path $driverZip -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) {
            throw "RTL-SDR $rtlVersion archive checksum mismatch: $actualHash"
          }
          Expand-Archive -Path $driverZip -DestinationPath $driverRoot -Force
          Get-ChildItem $driverRoot -Recurse -File | Select-Object FullName, Length | Format-Table
          $library = Get-ChildItem $driverRoot -Recurse -File -Filter "rtlsdr.dll" |
            Where-Object { $_.FullName -match '[/\\]x64[/\\]' } | Select-Object -First 1
          if (!$library) { throw "RTL-SDR upstream release lacks the x64 rtlsdr.dll" }
          $vendorDir = Split-Path $library.FullName -Parent
          Copy-Item $library.FullName "preview/rtlsdr.dll" -Force
          foreach ($dependency in @("pthreadVC2.dll", "pthread.dll", "libusb-1.0.dll", "libusb.dll")) {
            $dependencyPath = Join-Path $vendorDir $dependency
            if (Test-Path $dependencyPath) {
              Copy-Item $dependencyPath (Join-Path "preview" $dependency) -Force
            }
          }
          New-Item -ItemType Directory -Force -Path "preview/licenses/rtl-sdr-blog" | Out-Null
          New-Item -ItemType Directory -Force -Path "preview/licenses/pthreads-win32" | Out-Null
          Copy-Item "third_party/rtl-sdr-blog/COPYING" "preview/licenses/rtl-sdr-blog/COPYING"
          Copy-Item "third_party/pthreads-win32/COPYING" "preview/licenses/pthreads-win32/COPYING"
          Copy-Item "third_party/pthreads-win32/COPYING.LIB" "preview/licenses/pthreads-win32/COPYING.LIB"
          Copy-Item "third_party/SDR_RUNTIME_NOTICES.md" "preview/licenses/SDR_RUNTIME_NOTICES.md"
          # This self-test uses the exact DLLs in the extracted app directory,
          # checks for loader/dependency failures, and never claims hardware.
          $smoke = Start-Process -FilePath (Resolve-Path "preview/SignalForge.exe") `
            -ArgumentList "--rtl-driver-self-test" -PassThru -Wait -NoNewWindow
          if ($smoke.ExitCode -ne 0) {
            throw "Packaged RTL-SDR library failed to load: exit $($smoke.ExitCode)"
          }
          Write-Host "Bundled RTL-SDR Blog $rtlVersion x64 runtime verified"
          python tools/generate_demo_mbtiles.py "preview/maps/SignalForge_Offline_GIS_Sample.mbtiles"
          if (!(Test-Path "preview/maps/SignalForge_Offline_GIS_Sample.mbtiles")) {
            throw "Bundled map generator did not create a file"
          }
      - name: Upload Windows preview
        uses: actions/upload-artifact@v4
        with:
          name: SignalForge-Windows-Preview
          path: preview/
          if-no-files-found: error
          retention-days: 14

  core-only:
    name: Core-only (no Qt)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-core -DSIGNALFORGE_BUILD_GUI=OFF -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build-core --parallel 2
      - name: Test
        run: ctest --test-dir build-core --output-on-failure
      - name: Validate offline sample generation
        run: python3 tools/generate_demo_mbtiles.py "${{ runner.temp }}/SignalForge_Offline_GIS_Sample.mbtiles"
